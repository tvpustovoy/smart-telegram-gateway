<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Mulish, 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t1 d1">
<title id="t1">Как идёт сообщение через шлюз</title>
<desc id="d1">Telegram → шлюз (кто пишет, запись в базу, «получил», квитанция, команды, голос, эпизод; база и файлы — внутри шлюза) → по локальному сокету шлюза → переходник (адаптер) агентной среды → ответ обратно через шлюз.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A38"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695E"/></marker></defs>
<rect width="1200" height="700" fill="#F3F7F7"/>
<text x="24" y="40" font-size="22" fill="#1C1C1A" font-weight="700" text-anchor="start">Как идёт сообщение</text>
<text x="24" y="64" font-size="13" fill="#6A6A66" font-weight="400" text-anchor="start">Telegram ⇄ шлюз (база внутри) ⇄ сокет шлюза ⇄ переходник ⇄ агент · переходники меняются, шлюз тот же</text>
<rect x="24" y="96" width="150" height="480" rx="8" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="40" y="124" font-size="16" fill="#1C1C1A" font-weight="700" text-anchor="start">Telegram</text>
<rect x="34" y="138" width="130" height="72" rx="6" fill="#FAE5C4" stroke="#F28D20" stroke-width="1"/>
<text x="44" y="159.0" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">Владелец пишет</text>
<text x="44" y="174.9" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">текстом, голосом,</text>
<text x="44" y="190.8" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">пересылает</text>
<rect x="34" y="330" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#00695E" stroke-width="1"/>
<text x="44" y="351.0" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">👀 № 118 (эп. 42)</text>
<text x="44" y="366.9" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">записал: «…»</text>
<rect x="34" y="492" width="130" height="66" rx="6" fill="#C7E2D8" stroke="#00695E" stroke-width="1"/>
<text x="44" y="512.0" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">ответ агента —</text>
<text x="44" y="527.9" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">текстом или</text>
<text x="44" y="543.8" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="start">голосом</text>
<rect x="236" y="96" width="712" height="480" rx="10" fill="#FFFFFF" stroke="#00695E" stroke-width="1.6"/>
<text x="252" y="124" font-size="16" fill="#1C1C1A" font-weight="700" text-anchor="start">Шлюз</text>
<text x="306" y="124" font-size="12" fill="#6A6A66" font-weight="400" text-anchor="start">отдельный процесс · ключи и база только здесь · сейчас без модели</text>
<rect x="248" y="140" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="167" r="11" fill="#00695E"/>
<text x="268" y="171.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="288" y="162" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Кто пишет?</text>
<text x="288" y="181" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">по правилам доступа; незнакомым — молчание</text>
<rect x="248" y="201" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="228" r="11" fill="#00695E"/>
<text x="268" y="232.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="288" y="223" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">👀 — сразу</text>
<text x="288" y="242" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">реакция ещё до записи</text>
<rect x="248" y="262" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="289" r="11" fill="#00695E"/>
<text x="268" y="293.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="288" y="284" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Записать в базу</text>
<text x="288" y="303" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">событие и смещение — одной транзакцией</text>
<rect x="248" y="323" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="350" r="11" fill="#00695E"/>
<text x="268" y="354.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="288" y="345" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Только теперь Telegram: «получил»</text>
<text x="288" y="364" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">упал раньше — Telegram пришлёт то же снова</text>
<rect x="248" y="384" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="411" r="11" fill="#00695E"/>
<text x="268" y="415.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="288" y="406" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Квитанция и команды — кодом</text>
<text x="288" y="425" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">«№ N записал»; стоп, «где мы» — мимо агента</text>
<rect x="248" y="445" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="472" r="11" fill="#00695E"/>
<text x="268" y="476.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="288" y="467" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Голос и эпизод</text>
<text x="288" y="486" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">распознаёт после записи; «Тема · Роль»</text>
<rect x="248" y="506" width="420" height="54" rx="6" fill="#F3F7F7" stroke="#E3EAEA" stroke-width="1"/>
<circle cx="268" cy="533" r="11" fill="#00695E"/>
<text x="268" y="537.5" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="288" y="528" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Отдать переходнику · отправить ответ</text>
<text x="288" y="547" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">по сокету; ответ — текстом или голосом</text>
<rect x="696" y="150" width="236" height="396" rx="10" fill="#F3F7F7" stroke="#3A3A38" stroke-width="1.2"/>
<ellipse cx="814.0" cy="150" rx="118.0" ry="10" fill="#E3EAEA" stroke="#3A3A38" stroke-width="1.2"/>
<text x="814.0" y="184" font-size="14.5" fill="#1C1C1A" font-weight="700" text-anchor="middle">База SQLite</text>
<text x="814.0" y="202" font-size="11.5" fill="#6A6A66" font-weight="400" text-anchor="middle">пишет только шлюз</text>
<rect x="708" y="218" width="212" height="28" rx="5" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="814.0" y="236.5" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">входящие и смещение</text>
<rect x="708" y="254" width="212" height="28" rx="5" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="814.0" y="272.5" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">исходящие</text>
<rect x="708" y="290" width="212" height="28" rx="5" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="814.0" y="308.5" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">эпизоды</text>
<rect x="708" y="326" width="212" height="28" rx="5" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="814.0" y="344.5" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">кнопки · журнал правил</text>
<text x="814.0" y="382" font-size="11.5" fill="#6A6A66" font-weight="400" text-anchor="middle">рядом — файлы</text>
<rect x="708" y="392" width="212" height="28" rx="5" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<text x="814.0" y="410.5" font-size="11.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">звук · правила · журнал</text>
<rect x="708" y="440" width="212" height="90" rx="6" fill="#C7E2D8" stroke="#00695E" stroke-width="1"/>
<text x="814.0" y="466.0" font-size="12.5" fill="#1C1C1A" font-weight="700" text-anchor="middle">Записано здесь — значит,</text>
<text x="814.0" y="483.2" font-size="12.5" fill="#1C1C1A" font-weight="700" text-anchor="middle">не потеряется</text>
<line x1="668" y1="289.0" x2="696" y2="289.0" stroke="#3A3A38" stroke-width="1.6" marker-end="url(#a)"/>
<text x="688" y="282.0" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">запись</text>
<rect x="942" y="150" width="12" height="396" rx="3" fill="#00695E" stroke="#00695E" stroke-width="1"/>
<text x="974" y="142" font-size="10.5" fill="#1C1C1A" font-weight="700" text-anchor="middle">сокет</text>
<rect x="1024" y="150" width="152" height="188" rx="10" fill="#FFFFFF" stroke="#00695E" stroke-width="1.6"/>
<rect x="1038" y="206" width="96" height="22" rx="11" fill="#C7E2D8" stroke="#00695E" stroke-width="1"/>
<text x="1038" y="176" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">Переходник</text>
<text x="1038" y="194" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">к Claude Code</text>
<text x="1086.0" y="221" font-size="10.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">macOS · сейчас</text>
<text x="1038" y="248.0" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start">MCP-сервер: Claude</text>
<text x="1038" y="263.9" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start">Code запускает его</text>
<text x="1038" y="279.8" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start">с сессией агента;</text>
<text x="1038" y="295.7" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start">агент видит его</text>
<text x="1038" y="311.6" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start">инструменты.</text>
<rect x="1024" y="352" width="152" height="92" rx="10" fill="#FFFFFF" stroke="#6A6A66" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="1038" y="408" width="52" height="22" rx="11" fill="#E3EAEA" stroke="#6A6A66" stroke-width="1"/>
<text x="1038" y="378" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">Переходник</text>
<text x="1038" y="396" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">к серверу</text>
<text x="1064.0" y="423" font-size="10.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">позже</text>
<text x="1038" y="450.0" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start"></text>
<rect x="1024" y="458" width="152" height="92" rx="10" fill="#FFFFFF" stroke="#6A6A66" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="1038" y="514" width="52" height="22" rx="11" fill="#E3EAEA" stroke="#6A6A66" stroke-width="1"/>
<text x="1038" y="484" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">Переходник</text>
<text x="1038" y="502" font-size="14" fill="#1C1C1A" font-weight="700" text-anchor="start">к платформам</text>
<text x="1064.0" y="529" font-size="10.5" fill="#1C1C1A" font-weight="400" text-anchor="middle">позже</text>
<text x="1038" y="556.0" font-size="11.5" fill="#3A3A38" font-weight="400" text-anchor="start"></text>
<line x1="174" y1="167.0" x2="248" y2="167.0" stroke="#3A3A38" stroke-width="1.6" marker-end="url(#a)"/>
<text x="212" y="160.0" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">сообщение</text>
<line x1="248" y1="356" x2="164" y2="356" stroke="#00695E" stroke-width="1.6" marker-end="url(#at)"/>
<text x="212" y="349" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">квитанция</text>
<line x1="248" y1="533.0" x2="164" y2="533.0" stroke="#00695E" stroke-width="1.6" marker-end="url(#at)"/>
<text x="212" y="526.0" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">ответ</text>
<line x1="954" y1="214" x2="1024" y2="214" stroke="#3A3A38" stroke-width="1.6" marker-end="url(#a)"/>
<text x="988" y="207" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">событие</text>
<line x1="1024" y1="262" x2="954" y2="262" stroke="#00695E" stroke-width="1.6" marker-end="url(#at)"/>
<text x="988" y="255" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">ответ,</text>
<text x="988" y="280" font-size="10" fill="#6A6A66" font-weight="400" text-anchor="middle">обработано</text>
<line x1="954" y1="398" x2="1024" y2="398" stroke="#6A6A66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="954" y1="504" x2="1024" y2="504" stroke="#6A6A66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="24" y="596" width="376" height="84" rx="8" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<rect x="24" y="596" width="5" height="84" rx="2" fill="#1C1C1A"/>
<text x="42" y="620" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Агент упал или Claude Code закрыт</text>
<text x="42" y="640.0" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">событие ждёт в базе без отметки и отдаётся снова;</text>
<text x="42" y="656.6" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">владельцу — строка «сообщения сохраняю»</text>
<rect x="412" y="596" width="376" height="84" rx="8" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<rect x="412" y="596" width="5" height="84" rx="2" fill="#00695E"/>
<text x="430" y="620" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Ключи и база — только у шлюза</text>
<text x="430" y="640.0" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">переходник говорит со шлюзом по сокету; агенту</text>
<text x="430" y="656.6" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">ключи не нужны, в базу он не пишет</text>
<rect x="800" y="596" width="376" height="84" rx="8" fill="#FFFFFF" stroke="#E3EAEA" stroke-width="1"/>
<rect x="800" y="596" width="5" height="84" rx="2" fill="#6A6A66"/>
<text x="818" y="620" font-size="13.5" fill="#1C1C1A" font-weight="700" text-anchor="start">Переходники меняются, шлюз тот же</text>
<text x="818" y="640.0" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">сейчас Claude Code на macOS, позже сервер и другие</text>
<text x="818" y="656.6" font-size="12" fill="#3A3A38" font-weight="400" text-anchor="start">агентские платформы — один протокол сокета</text>
</svg>
